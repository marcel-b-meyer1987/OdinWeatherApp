<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Weather App</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./main.js"></script>
</head>
<body>
    
    <h1>Odin Weather</h1>
    <form action="" class="form-group">
        <input type="text" name="place" id="place" required placeholder="Enter a location">
        <span id="place-error" class="error-text"></span>
        <input type="submit" value="Show Weather">
    </form>

    <div id="weather-display-container">
        <div id="plus-0">
            <span class="temp">7</span><span class="temp-unit">°C</span>
            <span class="weather">Sunny</span>
            <span class="humidity">55</span>
            <span class="feels-like temp">5</span><span class="temp-unit">°C</span>
        </div>
        <div id="forecast">
            <div id="plus-1">
                <span class="temp">7</span><span class="temp-unit">°C</span>
                <span class="weather">Sunny</span>
                <span class="humidity">55</span>
                <span class="feels-like temp">5</span><span class="temp-unit">°C</span>
            </div>
            <div id="plus-2">
                <span class="temp">7</span><span class="temp-unit">°C</span>
                <span class="weather">Sunny</span>
                <span class="humidity">55</span>
                <span class="feels-like temp">5</span><span class="temp-unit">°C</span>
            </div>
            <div id="plus-3">
                <span class="temp"></span><span class="temp-unit"></span>
                <span class="weather"></span>
                <span class="humidity"></span>
                <span class="feels-like temp"></span><span class="temp-unit"></span>
            </div>
            <div id="plus-4">
                <span class="temp">7</span><span class="temp-unit">°C</span>
                <span class="weather">Sunny</span>
                <span class="humidity">55</span>
                <span class="feels-like temp">5</span><span class="temp-unit">°C</span>
            </div>
            <div id="plus-5">
                <span class="temp">7</span><span class="temp-unit">°C</span>
                <span class="weather">Sunny</span>
                <span class="humidity">55</span>
                <span class="feels-like temp">5</span><span class="temp-unit">°C</span>
            </div>
        </div>
    </div>
</body>
</html>
