<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Weather App</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./main.js"></script>
</head>
<body>
    
    <h1>Odin Weather</h1>
    <form action="" class="form-group">
        <input type="text" name="place" id="place" required placeholder="Enter a location">
        <span id="place-error" class="error-text"></span>
        <div class="segmented-control">
            <input type="radio" name="temp-unit" id="celsius" value="°C" checked>
            <label for="celsius">°C</label>

            <input type="radio" name="temp-unit" id="fahrenheit" value="°F">
            <label for="fahrenheit">°F</label>

            <span class="glider"></span>
        </div>
        <input type="submit" value="Show Weather">

    </form>
